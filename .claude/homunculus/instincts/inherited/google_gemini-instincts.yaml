# Google_gemini Workflow Bulk Dependency Update Across Multiple Packages

## Action

Follow the bulk-dependency-update-across-multiple-packages workflow:
1. Identify outdated dependencies in multiple packages.
2. Update package.json (if present) and lockfiles (package-lock.json, pnpm-lock.yaml) in each affected package/directory.
3. Regenerate lockfiles to reflect new dependency versions.
4. Commit all updated package.json and lockfile changes together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: **/package.json, **/package-lock.json, **/pnpm-lock.yaml

